<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript & DOM Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1 id="main-title">Welcome to My Web Page</h1>
  </header>

  <section>
    <p id="description">This is a demo of DOM manipulation with JavaScript.</p>
    <button id="change-text-btn">Change Text</button>
  </section>

  <section>
    <button id="toggle-style-btn">Toggle Background</button>
  </section>

  <section>
    <button id="add-element-btn">Add New Item</button>
    <button id="remove-element-btn">Remove Last Item</button>
    <ul id="item-list">
      <li>Item 1</li>
      <li>Item 2</li>
    </ul>
  </section>

  <footer>
    <p>&copy; 2025 My Website</p>
  </footer>

  <script src="script.js"></script>

</html>
