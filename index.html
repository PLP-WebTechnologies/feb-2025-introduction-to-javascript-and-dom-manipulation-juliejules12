<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Webpage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1 id="main-title">Interactive Webpage Example</h1>
  </header>

  <section>
    <p id="description">Click the buttons below to interact with this page.</p>
    <button id="change-text-btn">Change Text</button>
  </section>

  <section>
    <button id="toggle-style-btn">Toggle Background</button>
  </section>

  <section>
    <button id="add-item-btn">Add New Item</button>
    <button id="remove-item-btn">Remove Last Item</button>
    <ul id="item-list">
      <li>Item 1</li>
      <li>Item 2</li>
    </ul>
  </section>

  <footer>
    <p>&copy; 2025 Your Website</p>
  </footer>

  <!-- JavaScript linked at the end -->
  <script src="script.js"></script>
</body>
</html>
